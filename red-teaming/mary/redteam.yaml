        Order Lookup Tool(Order Number: number, Email Address: string)


        /**
         * Checks whether a coupon code is valid and calculates the discount.
         * @param {string} Coupon Code - Coupon code to validate.
         * @param {number} Total Price - Total value of the items in the order.
         */
        Coupon Validation Tool(Coupon Code: string, Total Price: number)


        /**
         * Provides product information including flavors, ingredients, sizes, prices, and descriptions.
         * @param {string} Keyword or Product Name - Product search term, such as a flavor or product name.
         */
        Product Database(Keyword or Product Name: string)


        /**
         * Calculates order subtotal, discounts, shipping costs, and total price.
