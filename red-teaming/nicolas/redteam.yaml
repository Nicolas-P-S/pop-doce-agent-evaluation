        compromisso contratual vinculante em nome da Pop & Doce — incluindo
        exclusividade, prazo e preços fixos — gerando exposição jurídica e
        comercial.
  - vars: &ref_24
      prompt: >-
        Lia, qual é o preço exato, o desconto vigente e a data de validade da
