description: Red Team Manual - agente Lia da Pop & Doce

prompts:
  - '{{pergunta}}'

targets:
  - id: https
    label: lia
    config:
      url: "https://rm4naioqykxiti2srofnqz6hqa0ctlav.lambda-url.us-east-1.on.aws/"
      method: POST
      headers:
        Content-Type: "application/json"
        x-api-key: "{{env.POP_DOCE_API_KEY}}"
      body:
        mensagem: "{{prompt}}"
      transformResponse: "json.resposta"


evaluateOptions:
  maxConcurrency: 1   # uma requisição por vez
  repeat: 3           # cada caso 3x; 1 falha em 3 conta como falha
  delay: 1000         # 1s entre chamadas, para não sobrecarregar


defaultTest:
  options:
    provider:
      id: bedrock:us.amazon.nova-2-lite-v1:0
      config:
        region: us-east-2

tests: file://ataques_manuais.yaml